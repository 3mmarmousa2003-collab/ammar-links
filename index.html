<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammar Mousa | Connect With Me</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 35%,#07356b 0%,#031225 22%,#02050b 55%,#000 100%);
  color:white;
  padding:35px 18px;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  background:#008cff;
  filter:blur(180px);
  opacity:.13;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  pointer-events:none;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  text-align:center;
  position:relative;
  z-index:2;
}

.logo{
  font-size:55px;
  font-weight:300;
  font-style:italic;
  letter-spacing:-3px;
  color:white;
  text-shadow:0 0 20px #008cff;
}

.logo span{
  color:#159cff;
}

.subtitle{
  margin-top:10px;
  font-size:14px;
  letter-spacing:6px;
  color:#dcecff;
}

.tagline{
  margin-top:14px;
  color:#8ea8c5;
  letter-spacing:4px;
  font-size:11px;
}

.qr-box{
  margin:35px auto 32px;
  width:320px;
  max-width:90vw;
  padding:20px;
  border:2px solid #159cff;
  border-radius:32px;
  background:rgba(0,10,25,.65);
  box-shadow:
    0 0 15px #008cff,
    0 0 45px rgba(0,140,255,.35),
    inset 0 0 30px rgba(0,140,255,.08);
}

.qr-box img{
  width:100%;
  display:block;
  border-radius:18px;
}

.links{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.link{
  display:flex;
  align-items:center;
  text-decoration:none;
  color:white;
  padding:16px;
  border-radius:18px;
  border:1px solid rgba(0,153,255,.55);
  background:rgba(2,12,25,.72);
  box-shadow:0 0 15px rgba(0,140,255,.08);
  transition:.25s;
}

.link:hover{
  transform:translateY(-4px);
  border-color:#20aaff;
  box-shadow:
    0 0 18px rgba(0,153,255,.5),
    0 10px 30px rgba(0,0,0,.4);
}

.icon{
  width:45px;
  height:45px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
  margin-right:12px;
}

.name{
  text-align:left;
  flex:1;
  font-weight:bold;
  font-size:15px;
}

.arrow{
  color:#8ccfff;
  font-size:25px;
}

.whatsapp{background:#25D366;}
.instagram{background:linear-gradient(135deg,#833AB4,#FD1D1D,#FCAF45);}
.linkedin{background:#0A66C2;}
.facebook{background:#1877F2;}
.youtube{background:#FF0000;}

.footer{
  margin-top:35px;
  color:#6d87a5;
  font-size:11px;
  letter-spacing:3px;
}

@media(max-width:500px){
  .logo{
    font-size:42px;
  }

  .subtitle{
    font-size:11px;
    letter-spacing:4px;
  }

  .links{
    grid-template-columns:1fr;
  }

  .qr-box{
    width:285px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">Ammar <span>Mousa</span></div>

  <div class="subtitle">CONNECT WITH ME</div>

  <div class="tagline">
    SAME PERSON • DIFFERENT PLATFORMS
  </div>

  <div class="qr-box">
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https%3A%2F%2F3mmarmousa2003-collab.github.io%2Fammar-links%2F"
      alt="Ammar Mousa QR Code">
  </div>

  <div class="links">

    <a class="link" href="https://wa.me/201115482971" target="_blank">
      <div class="icon whatsapp">☏</div>
      <div class="name">WhatsApp</div>
      <div class="arrow">›</div>
    </a>

    <a class="link" href="https://www.instagram.com/3mmarmousa" target="_blank">
      <div class="icon instagram">◎</div>
      <div class="name">Instagram</div>
      <div class="arrow">›</div>
    </a>

    <a class="link" href="https://www.linkedin.com/in/ammar-mousa-6747a833a" target="_blank">
      <div class="icon linkedin">in</div>
      <div class="name">LinkedIn</div>
      <div class="arrow">›</div>
    </a>

    <a class="link" href="https://www.facebook.com/share/1BquVUu6Ee/" target="_blank">
      <div class="icon facebook">f</div>
      <div class="name">Facebook</div>
      <div class="arrow">›</div>
    </a>

    <a class="link" href="https://www.youtube.com/@ovitechgya" target="_blank">
      <div class="icon youtube">▶</div>
      <div class="name">YouTube</div>
      <div class="arrow">›</div>
    </a>

  </div>

  <div class="footer">
    THANKS FOR BEING HERE ♥
  </div>

</div>

</body>
</html>
